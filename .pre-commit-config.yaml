# See https://pre-commit.com for more information
# Ruff hooks use [tool.ruff] from pyproject.toml (line-length, rules, etc.)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint static/ --fix
        language: system
        types: [javascript]
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        types: [javascript]
        additional_dependencies: []
