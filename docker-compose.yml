version: "3.8"

services:
  eyecatcher:
    build: .
    ports:
      - "5001:8080"
    environment:
      - PORT=8080
      - FLASK_ENV=development
      # Set ADMIN_KEY for community moderation (use ALICE for local dev; set in production!)
      - ADMIN_KEY=ALICE
      - PYTHONPATH=/app/src
    volumes:
      # Mount source for hot-reload during development
      - .:/app
    # Override CMD for development with Flask debug mode (auto-reload)
    command: ["python", "-m", "eyecatcher.server"]
