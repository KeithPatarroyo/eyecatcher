[project]
name = "eyecatcher"
version = "0.1.0"
description = "Evolutionary time-varying CPPN patterns with shader generation"
requires-python = ">=3.9"
dependencies = [
    "neat-python>=0.92",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cppn_engine", "shader_compiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
