[project]
name = "eyecatcher"
version = "0.1.0"
description = "Evolutionary time-varying CPPN patterns with shader generation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "The Eyecatcher Contributors" },
]
keywords = [
    "cppn",
    "neuroevolution",
    "generative-art",
    "interactive-evolution",
    "shader",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "neat-python>=0.92",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "matplotlib>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/KeithPatarroyo/eyecatcher"
Repository = "https://github.com/KeithPatarroyo/eyecatcher"
Issues = "https://github.com/KeithPatarroyo/eyecatcher/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
