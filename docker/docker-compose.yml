# Run from repo root: docker compose -f docker/docker-compose.yml up --build
services:
  eyecatcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - PORT=8080
      - FLASK_ENV=development
      # Set ADMIN_KEY for community moderation (use ALICE for local dev; set in production!)
      - ADMIN_KEY=ALICE
      - PYTHONPATH=/app/src
      - EXPERIMENT_CONFIG=default
    volumes:
      # Mount repo root for hot-reload (relative to this compose file: .. = repo root)
      - ..:/app
    # Override CMD for development with Flask debug mode (auto-reload)
    command: ["python", "-m", "eyecatcher.server"]
